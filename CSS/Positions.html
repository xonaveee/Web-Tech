<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Positions</title>

<style>

*{
  padding: 0;
  margin: 0;
  box-sizing: border-box;
}

article{
  border: 5px solid black;
  height: 650px;
  width: 800px;
  margin: 100px 500px;
  position: relative;
}

div{
  border: 3px solid black;
  height: 100px;
  width: 150px;

}
  article>div:nth-child(1){
    background-color: red;
    /* position: sticky;
    top: 0; */
    position: absolute;
  }

  article>div:nth-child(2){
    background-color: blue;
    /* position: relative;
    left: 300px;
    top: 300px; */
    position: absolute;
    right: 0;
  }
  article>div:nth-child(3){
    background-color: purple;
    /* position: absolute;
    
    right: 90px;
    bottom: -600px; */
    position: absolute;
    bottom: 0;
  }
  article>div:nth-child(4){
    background-color: greenyellow;
    /* position: fixed;
    top: 300px;
    left: 80px; */
    position: absolute;
    bottom: 0;
    right: 0;
  }
  
</style>

</head>
<body>
  <article>
    <div>1</div>
    <div>2</div>
    <div>3</div>
    <div>4</div>
    
  </article>
</body>
</html>
