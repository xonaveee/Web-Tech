<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>

    *{
      padding: 0;
      margin: 0;
      box-sizing: border-box;
    }

    article{
      height: 600px;
      width: 1200px;
      border: solid;
      margin-left: 170px;
      margin-top: 60px;
      display: flex; 
      flex-direction: row;
      gap: 60px;
      flex-wrap: wrap ;
      /* justify-content: space-between; */
      /* align-items: center; */
       /* justify-content: center; */
      /* align-items: center; */
      
    }
    div{
      height: 120px;
      flex-basis: 120px;
      border: solid;
    }
    article>div:nth-child(1){
    background-color: red;
    order: 1;
  }

  article>div:nth-child(2){
    background-color: blue;

  }
  article>div:nth-child(3){
    background-color: purple;
    order: -1;

  }
  article>div:nth-child(4){
    background-color: greenyellow;

  }
  
  </style>
</head>
<body>
    <article>
      <div>1</div>
      <div>2</div>
      <div>3</div>
      <div>4</div>
      <!-- <div>4</div>
      <div>4</div>
      <div>4</div>
      <div>4</div>
      <div>4</div> -->

    </article>
</body>
</html>
