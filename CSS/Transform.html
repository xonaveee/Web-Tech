<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

  <style>
    *{
      padding: 0;
      margin: 0;
      box-sizing: border-box;
    }
    body{
  
      display: flex;
      height: 100vh;
      width: 100vw;
      justify-content: center;
      align-items: center;
    }

    div{
      border: solid;
      height: 400px;
      width: 400px;
      /* transform: scale(1.2,0.8) translate(100px) skew(180deg,45deg) rotate(300deg); */
      transition: all 5s 2s;
    }


    div:hover{
      background-color: red;
      border-radius: 50%;
      transform: scale(0.8);
    }
  </style>
</head>
<body>
  <div>

  </div>
</body>
</html>
